{% extends 'accounts/base.html' %}
{% block title %}Change Password{% endblock title %}
{% block content %}
<div class="flex items-center justify-content px-4 py-8">
    <div class="w-full max-w-md p-8 space-y-6 bg-gray-800 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-white">Change Password</h2>
        <form method="post" class="space-y-6" action="{% url 'password_change' %}">
            {% csrf_token %}
            <div>
                <label for="id_old_password" class="block text-sm font-medium text-gray-300">Current Password</label>
                <input type="password" name="old_password" id="id_old_password" required
                    class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-rose-400"
                    placeholder="Enter your current password">
                <!--New Password-->
                <label for="id_new_password1" class="block text-sm font-medium text-gray-300">New Password</label>
                <input type="password" name="new_password1" id="id_new_password1" required
                    class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-rose-400"
                    placeholder="Enter your new password">
                <!--Confirm New Password-->
                <label for="id_new_password2" class="block text-sm font-medium text-gray-300">Confirm New
                    Password</label>
                <input type="password" name="new_password2" id="id_new_password2" required
                    class="w-full px-3 py-2 mt-1 border rounded-md focus:outline-none focus:ring-2 focus:ring-rose-400"
                    placeholder="Confirm your new password">
            </div>
            <div class="flex items-center justify-content">
                <button type="submit"
                    class="px-4 py-2 bg-rose-500 text-white rounded-md hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-400">Change
                    Password</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
