<!--Password Reset or Forgot Password Form-->
{% extends 'accounts/base.html' %}
{% block title %}Password Reset{% endblock %}
{% block content %}

<div class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold text-center mb-6">Reset Your Password</h2>
        <form method="post" action="{% url 'password_reset' %}" class="space-y-6 " id="reset-password-form" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email Address</label>
                <input type="email" value="{{ form.email.value|default:''}}" id="email" name="email" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300"placeholder="Enter your email address">
                {% if form.email.errors %}
                    <div class="text-red-500 text-sm mt-1">
                        {% for error in form.email.errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition duration-200">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
<script>
const form = document.getElementById('reset-password-form');
const submitBtn = document.getElementById('submit-btn');
form.addEventListener('submit', function() {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    
});

</script>
