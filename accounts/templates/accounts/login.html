{% extends 'accounts/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-black">Login to Your Account</h2>
        <form method="POST" action="#" class="space-y-6">
            {% csrf_token %}
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-gray-700 mb-2">Email</label>
                <input type="email" name="email" id="email" required
                    class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Enter your email">
            </div>
            <!-- Password Field -->
            <div>
                <label for="password" class="block text-gray-700 mb-2">Password</label>
                <input type="password" name="password" id="password" required
                    class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Enter your password">
            </div>      
            <!-- Forgot Password Link -->
            <div class="text-sm text-right">
                <a href="#" class="text-blue-500 hover:underline">Forgot password</a>
            </div>
            <!-- Submit Button -->
            <div>
                <button type="submit"
                    class="w-full px-4 py-2 font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Login
                </button>
        </form>

    </div>


</div>
{% endblock content %}
