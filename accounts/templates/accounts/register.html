{% extends 'accounts/base.html' %}
{% load static %}
{% block title %}Register{% endblock title %}
{% block content %}
<div class="flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-semibold text-center mb-6">Create an Account</h2>
        <form method="post" action="{% url 'register' %}" class="space-y-6" id="register-form" novalidate>
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="block text-gray-700 mb-2">Name</label>
                <input type="text" id="name" name="name" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Write your Name" required">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Enter your email address">
            </div> 
            <div class="mb-4">
                <label for="password" class="block text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Create a password">
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="block text-gray-700 mb-2">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="Confirm your password">
            </div>
            <!--Register Button -->
            <button type="submit" class="w-full px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-rose-700 focus:outline-none focus:bg-rose-700">Register</button>
        </form>
        <!--DIvider-->
        <div class="relative mt-4">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-400">Or</span>
            </div>
        </div>
        <!--Login Link-->
        <div class="text-center">
            <p class="text-sm text-gray-400">Already have an account? <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-800">Login here</a></p>
        </div>
    </div>
</div>
{% endblock content %}
